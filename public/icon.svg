<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)"/>
  
  <!-- Magnifying glass -->
  <circle cx="220" cy="220" r="80" fill="none" stroke="white" stroke-width="16"/>
  <line x1="280" y1="280" x2="340" y2="340" stroke="white" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Circuit nodes inside magnifying glass -->
  <circle cx="200" cy="200" r="8" fill="white"/>
  <circle cx="240" cy="200" r="8" fill="white"/>
  <circle cx="200" cy="240" r="8" fill="white"/>
  <circle cx="240" cy="240" r="8" fill="white"/>
  
  <!-- Circuit lines -->
  <line x1="200" y1="200" x2="240" y2="200" stroke="white" stroke-width="3"/>
  <line x1="200" y1="200" x2="200" y2="240" stroke="white" stroke-width="3"/>
  <line x1="240" y1="200" x2="240" y2="240" stroke="white" stroke-width="3"/>
  <line x1="200" y1="240" x2="240" y2="240" stroke="white" stroke-width="3"/>
  
  <!-- AI text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">REA</text>
</svg>
